name: nightly-bench

on:
  schedule:
    # 03:00 JST every day
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the release binary
        run: cargo build --release --locked
      - name: Start the server
        run: |
          set -euo pipefail
          nohup ./target/release/rustxng --port 29483 > /tmp/rustxng.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:29483/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          echo 'server did not become ready' >&2
          cat /tmp/rustxng.log >&2
          exit 1
      - name: Run the 100 question benchmark
        run: |
          set -euo pipefail
          python3 tools/eval_quality.py --base http://127.0.0.1:29483 \
            --delay 1.0 --json bench/nightly.json | tee /tmp/bench.txt
      - name: Check the result against the floor
        run: python3 tools/check_bench.py bench/nightly.json --floor-hit1 50
      - name: Publish the summary
        if: always()
        run: |
          {
            echo '## 100 問ベンチマーク'
            echo ''
            echo '```'
            cat /tmp/bench.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-result
          path: bench/nightly.json
          retention-days: 30
          if-no-files-found: warn
