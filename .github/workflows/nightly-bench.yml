name: nightly-offline

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Offline retrieval and removed-source regressions
        run: cargo test --locked --test integration --test non_html_network --test tos_prohibited_sources
      - name: Offline evaluation, release and audit policy tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Publish result
        run: echo 'Local fixtures passed. No external search providers or LLMs were queried.' >> "$GITHUB_STEP_SUMMARY"
