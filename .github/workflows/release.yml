name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to publish, e.g. v0.26.0'
        required: true
        type: string
      dry_run:
        description: 'Build and verify everything, upload nothing'
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  PYTHONUTF8: '1'

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.source.outputs.matrix }}
      targets: ${{ steps.source.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, main ancestry and exact successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/release_tools.py validate --tag "$RELEASE_TAG"
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=100" > "$RUNNER_TEMP/runs.json"
          python3 tools/release_tools.py ci-gate --tag "$RELEASE_TAG" --sha "$sha" --repository "$GITHUB_REPOSITORY" --runs "$RUNNER_TEMP/runs.json"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          targets = json.loads(Path('.github/release-targets.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'include': targets}), file=output)
              print('targets=' + ' '.join(item['target'] for item in targets), file=output)
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install the musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Check architecture, native version and startup
        shell: bash
        env:
          NATIVE: ${{ matrix.native }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          native=()
          if [ "$NATIVE" = true ]; then native+=(--native); fi
          python3 tools/release_tools.py binary --tag "$RELEASE_TAG" --binary "$binary" --target "${{ matrix.target }}" "${native[@]}"
          if [ "$NATIVE" = true ]; then python3 tools/smoke_agent_setup.py --binary "$binary"; fi
      - name: Stage the binary and its checksum
        shell: bash
        run: |
          set -euo pipefail
          name="saferustxng-${RELEASE_TAG}-${{ matrix.target }}"
          case "${{ matrix.artifact }}" in *.exe) name="$name.exe" ;; esac
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/$name"
          python3 - "$name" <<'PY'
          import hashlib, sys
          from pathlib import Path
          binary = Path('dist') / sys.argv[1]
          with binary.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          binary.with_name(binary.name + '.sha256').write_text(digest + '  ' + binary.name + '\n', encoding='utf-8', newline='\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: saferustxng-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      TARGETS: ${{ needs.prepare.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: saferustxng-*
          merge-multiple: true
          path: dist
      - name: Verify complete assets and generate source manifest and notes
        run: |
          set -euo pipefail
          cp LICENSE NOTICE dist/
          read -r -a targets <<< "$TARGETS"
          python3 tools/release_tools.py manifest --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --targets "${targets[@]}"
          python3 tools/release_tools.py notes --tag "$RELEASE_TAG" > "$RUNNER_TEMP/notes.md"
      - name: Upload a draft, verify downloaded bytes, then publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true || { echo 'published releases are immutable' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "SafeRustXNG $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # Only a private draft may be repaired; published assets are never replaced.
          gh release upload "$RELEASE_TAG" dist/* --clobber
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/verify"
          read -r -a targets <<< "$TARGETS"
          test -s "$RUNNER_TEMP/verify/release-manifest.json"
          python3 tools/release_tools.py verify --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --dist "$RUNNER_TEMP/verify" --targets "${targets[@]}"
          promote=true
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest.json" 2> "$RUNNER_TEMP/latest-error"; then
            current=$(jq -r .tag_name "$RUNNER_TEMP/latest.json")
            promote=$(python3 tools/release_tools.py promote --tag "$RELEASE_TAG" --current-tag "$current")
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/latest-error"; then
            cat "$RUNNER_TEMP/latest-error" >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$promote"
