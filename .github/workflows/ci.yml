name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflow syntax, expressions and shell
        run: '"$(go env GOPATH)/bin/actionlint" -color'

  verify-actions-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install GitHub Actions Lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.0
      - name: Verify GitHub Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build and test
        run: cargo test --locked --all-targets
      - name: Build the server binary
        run: cargo build --locked --bin saferustxng
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Python tool unit tests (offline)
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Agent setup smoke test (offline)
        # The script resolves the .exe suffix on Windows.
        run: python tools/smoke_agent_setup.py --binary target/debug/saferustxng
      - name: Build the example
        run: cargo build --release --example benchmark
      - name: Lint the Japanese docs
        if: runner.os == 'Linux'
        run: npx --yes markdownlint-cli2@0.24.0 "*.md" "docs/*.md"

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: saferustxng_test
          MARIADB_USER: saferustxng
          MARIADB_PASSWORD: fixture-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: mysql-integration
      - run: cargo test --locked --test mysql -- --ignored
        env:
          MYSQL_TEST_PORT: ${{ job.services.mariadb.ports['3306'] }}

  no-default-features:
    # The documented slim build (no database engines) must keep compiling.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: no-default-features
      - run: cargo build --release --locked --no-default-features

  msrv:
    # Cargo.toml's rust-version must hold for the locked dependency set.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: msrv
      - run: cargo check --locked --all-targets

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the image
        run: docker build --tag saferustxng:ci .
      - name: The image serves /healthz
        run: |
          set -euo pipefail
          docker run --detach --name saferustxng-ci --publish 127.0.0.1:29483:29483 saferustxng:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:29483/healthz; then
              echo "healthz ok"
              exit 0
            fi
            sleep 2
          done
          docker logs saferustxng-ci
          exit 1
      - name: Stop the container
        if: always()
        run: docker rm --force saferustxng-ci || true
