name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build and test
        run: cargo test --all-targets
      - name: Build the server binary
        run: cargo build --locked --bin saferustxng
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tool unit tests (offline)
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Agent setup smoke test (offline)
        # The script resolves the .exe suffix on Windows.
        run: python tools/smoke_agent_setup.py --binary target/debug/saferustxng
      - name: Build the example
        run: cargo build --release --example benchmark
      - name: Lint the Japanese docs
        if: runner.os == 'Linux'
        run: npx --yes markdownlint-cli2 "*.md" "docs/*.md" 

  no-default-features:
    # The documented slim build (no database engines) must keep compiling.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-default-features
      - run: cargo build --release --locked --no-default-features

  msrv:
    # Cargo.toml's rust-version must hold for the locked dependency set.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag saferustxng:ci .
      - name: The image serves /healthz
        run: |
          set -euo pipefail
          docker run --detach --name saferustxng-ci --publish 127.0.0.1:29483:29483 saferustxng:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:29483/healthz; then
              echo "healthz ok"
              exit 0
            fi
            sleep 2
          done
          docker logs saferustxng-ci
          exit 1
      - name: Stop the container
        if: always()
        run: docker rm --force saferustxng-ci || true
