name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # repository names must be lowercase, hence the literal path
          images: ghcr.io/yuzolabs/saferustxng
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test the published image
        run: |
          set -euo pipefail
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name smoke -p 127.0.0.1:29483:29483 "$image"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:29483/healthz > /dev/null; then echo "image serves /healthz"; exit 0; fi
            sleep 2
          done
          echo "image did not become healthy" >&2
          docker logs smoke >&2
          exit 1
