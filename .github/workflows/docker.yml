name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to publish'
        required: true
        type: string
      dry_run:
        description: 'Build and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release source and successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/release_tools.py validate --tag "$RELEASE_TAG"
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=100" > "$RUNNER_TEMP/runs.json"
          python3 tools/release_tools.py ci-gate --tag "$RELEASE_TAG" --sha "$sha" --repository "$GITHUB_REPOSITORY" --runs "$RUNNER_TEMP/runs.json"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: saferustxng-verify:local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Verify the native image before publication
        run: bash tools/smoke_container.sh saferustxng-verify:local "${RELEASE_TAG#v}"
      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested bytes without replacing a released version
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          # A unique staging reference makes publication independent of rebuilding.
          staging="$image:staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag saferustxng-verify:local "$staging"
          docker push "$staging"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$staging")
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
          if docker buildx imagetools inspect "$image:$version" > "$RUNNER_TEMP/version-image" 2> "$RUNNER_TEMP/version-error"; then
            echo 'version image already exists; refusing to overwrite it' >&2
            exit 1
          elif ! grep -qiE 'manifest unknown|not found' "$RUNNER_TEMP/version-error"; then
            cat "$RUNNER_TEMP/version-error" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$image:$version" "$digest"
          if docker buildx imagetools inspect "$image:latest" > "$RUNNER_TEMP/latest-image" 2> "$RUNNER_TEMP/latest-error"; then
            docker pull "$image:latest"
            current=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image:latest")
            promote=$(python3 tools/release_tools.py promote --tag "$RELEASE_TAG" --current-tag "v${current#v}")
          elif grep -qiE 'manifest unknown|not found' "$RUNNER_TEMP/latest-error"; then
            promote=true
          else
            cat "$RUNNER_TEMP/latest-error" >&2
            exit 1
          fi
          if [ "$promote" = true ]; then
            minor="${version%.*}"
            docker buildx imagetools create --tag "$image:$minor" --tag "$image:latest" "$digest"
          fi
