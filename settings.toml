# rustxng settings — the format mirrors SearXNG's `settings.yml`.
# Everything here can be overridden by a user file passed with `--config` or
# `SEARXNG_SETTINGS_PATH`. See README.md and docs/PORTING.md.

[general]
debug = false
instance_name = "RustXNG"
contact_url = ""
enable_metrics = true

[server]
bind_address = "127.0.0.1"
port = 29483
# リクエストが無いままこの秒数が過ぎたら終了する（0 で無効）。
# rdsh などが起動するサイドカーが残り続けるのを防ぐ用途。
# 環境変数 RUSTXNG_IDLE_TIMEOUT でも指定できる。
idle_timeout = 0
secret_key = "ultrasecretkey"
# The limiter is a simplified per-client rate limit (upstream uses botdetection).
limiter = false
limiter_window = 60
limiter_max = 30
# image_proxy signs image URLs and refetches them from this instance.
image_proxy = false
method = "POST"

[search]
safe_search = 0
autocomplete = "duckduckgo"
autocomplete_min = 4
default_lang = "auto"
# --- 実験機能（既定オフ）---
# 自前の BM25 インデックス（rustxng-index で構築）。空なら無効。
# 有効にするとローカルのヒットが上流の結果に足され、精度が上がる代わりに
# クロールとインデックス管理が必要になる。
local_index_path = ""
# インデックスのヒットを上流の結果に足す（精度が上がる）
local_index_merge = true

# 結果を返さないエンジンを自動で休ませる（連続して空の応答が続いたとき）
empty_result_limit = 8
# 休ませる長さ（秒）
empty_result_cooldown = 300
ban_time_on_fail = 5
max_ban_time_on_fail = 120
max_page = 0
timeout_limit = 3.0
formats = ["html", "csv", "json", "rss"]
# --- 推奨設定（20 問ベンチで Tavily を上回ることを確認済み） ---
# parallel: 全エンジンを同時に開始。hit@5 80% / MRR 0.80（Tavily 0.41）で最良。
# timeout_limit=3.0: より短くすると品質が落ちる（1.5 秒で MRR 0.74）。3 秒が最良。
# include_raw_content=1（リクエスト側）で本文を付けると 4,158 字/件になり
# Tavily の 1,248 字を上回る。生本文はキャッシュされ繰り返しクエリは高速。
strategy = "parallel"
staged_tier = 8
staged_min_results = 10
# include_raw_content=1 のとき上位何件まで本文を取得するか（多いほど豊か・遅い）。
raw_content_limit = 5
# URL/タイトルにクエリ語が含まれる結果をどれだけ押し上げるか（0=上流の位置融合のみ）。
# Exa のニューラル検索は「公式ドキュメントの意図」を掴むため、これを上げて対抗する。
# 20 問ベンチで 4.0 が最良（MRR 0.838・hit@5 19/20 で Exa と同率）。
relevance_weight = 4.0

# クエリがサイト名を指すとき、そのサイト内検索（site: 付き）を二段目として
# 実行し、公式リファレンスページを取りこぼさないようにする。
# 100 問ベンチでは全体として逆効果（hit@1 68→62）だったため既定は false。
# 特定サイトのリファレンスを狙う用途では true にすると見つかりやすい。
site_scoped_retry = false

# 意味（埋め込み）リランキング — Exa のニューラル検索に完全対抗するため。
# OpenAI 互換の embeddings エンドポイントを指す。tools/embed_server.py
# （ローカル・高速・キー不要）か、クラウドの embeddings API を指定。
# 空文字列で無効（位置融合 + 関連度のみ）。
embedding_url = ""
embedding_model = "BAAI/bge-small-en-v1.5"
# コサイン類似度をスコアに足す強さ。高いほど意味検索の優先度が増す。
embedding_weight = 2.5
# クエリが指すサイト（arxiv / mdn / python / docker など）の正規ドメインを
# 押し上げ、ミラー（docker-docs.uclv.cu 等）を下げる強さ。意味検索でも
# 弁別できない「公式 vs コピー」を分ける。0 で無効。
# 20 問ベンチで 8.0 が最良（MRR 0.870・hit@1 17/20 で Exa を上回る）。
authority_weight = 8.0
# 何件の上位結果を埋め込みで並べ替えるか
embedding_topk = 25

[ui]
default_theme = "simple"
default_locale = "en"
center_alignment = false
results_on_new_tab = false
infinite_scroll = false
search_on_category_select = true
hotkeys = "default"

[outgoing]
request_timeout = 4.0
max_request_timeout = 20.0
useragent_suffix = ""
pool_connections = 100
pool_maxsize = 20
enable_http2 = true
verify = true
retries = 1
max_redirects = 20
keepalive_expiry = 5.0
using_tor_proxy = false

# 上流へ出るときのプロキシ。指定した scheme のリクエストがこのプロキシを通る。
# ブロックされているエンジン（Google / Bing など）を復活させる用途で使う。
# 注意: 現状は全エンジン共通で、エンジン個別の指定には未対応。
# [outgoing.proxies]
# https = "socks5h://127.0.0.1:9050"
# http = "socks5h://127.0.0.1:9050"

# Response cache.
# backend = "memory" keeps entries inside the process; backend = "valkey"
# stores them in Valkey / Redis so several instances share one cache.
[cache]
backend = "memory"
url = "redis://127.0.0.1:6379/0"
ttl = 300
# include_raw_content のページ本文もキャッシュするため、8 MB だとページが
# 早々に押し出される。32 MB に広げて繰り返しの検索・本文取得を速く保つ。
max_bytes = 33554432

# Deep research: GET /research?q=... がサブクエリを計画し、複数回検索して
# ページ本文を集め、LLM があれば引用付き markdown レポートを生成する。
# enabled = true かつ api_key があれば LLM を使う。無ければ証拠バンドルのみ。
[research]
enabled = false
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
max_queries = 5
max_sources = 10
timeout = 60

[plugins]
enabled = []
disabled = []

categories_as_tabs = ["general", "images", "videos", "news", "map", "music", "it", "science", "files", "social media"]

